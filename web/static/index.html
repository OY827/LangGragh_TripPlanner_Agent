<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能旅行规划助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 8px 15px;
            background: #f5f5f5;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            background: #e8e8e8;
        }

        .checkbox-item input {
            margin-right: 8px;
        }

        .checkbox-item label {
            margin: 0;
            font-weight: normal;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-section {
            display: none;
        }

        .result-section.active {
            display: block;
        }

        .day-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .day-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
        }

        .day-weather {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            background: #e8f4fd;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .attraction-list {
            margin-bottom: 15px;
        }

        .attraction-item {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .attraction-item .number {
            width: 28px;
            height: 28px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .attraction-info {
            flex: 1;
        }

        .attraction-info h4 {
            margin-bottom: 4px;
            color: #333;
        }

        .attraction-info p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 4px;
        }

        .meal-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .meal-item {
            padding: 8px 15px;
            background: #fff3e0;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .meal-item::before {
            content: '🍽️';
        }

        .hotel-info {
            padding: 12px;
            background: #e8f5e9;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hotel-info::before {
            content: '🏨';
            font-size: 1.5rem;
        }

        .hotel-info h4 {
            margin-bottom: 4px;
        }

        .hotel-info p {
            font-size: 0.9rem;
            color: #666;
        }

        .overall-suggestions {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 15px;
        }

        .overall-suggestions h4 {
            margin-bottom: 10px;
            color: #e65100;
        }

        .memory-section {
            background: #e3f2fd;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .memory-section h3 {
            margin-bottom: 10px;
            color: #1565c0;
        }

        .memory-info {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #37474f;
        }

        .error-message {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            color: #c62828;
            margin-top: 15px;
        }

        .api-docs {
            text-align: center;
            margin-top: 30px;
            color: white;
        }

        .api-docs a {
            color: white;
            text-decoration: underline;
        }

        .view-hidden {
            display: none !important;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            width: auto;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #f5f7ff;
        }

        .chat-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-height: 600px;
        }

        @media (max-width: 900px) {
            .chat-layout {
                grid-template-columns: 1fr;
            }
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            border: 2px solid #e8eaf6;
            border-radius: 12px;
            overflow: hidden;
            background: #fafafa;
            min-height: 500px;
        }

        .chat-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            font-size: 1.1rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 420px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message.system {
            align-self: center;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 0.85rem;
            max-width: 95%;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 16px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-input-area button {
            width: auto;
            padding: 12px 24px;
        }

        .plan-preview {
            border: 2px solid #e8eaf6;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 500px;
        }

        .plan-preview-header {
            padding: 16px 20px;
            background: #f5f7ff;
            border-bottom: 1px solid #e8eaf6;
            font-weight: 600;
            color: #333;
        }

        .plan-preview-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            max-height: 520px;
        }

        .changes-badge {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 10px 14px;
            margin-bottom: 12px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
        }

        .back-link {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
            padding: 0;
            width: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 智能旅行规划助手</h1>
            <p>输入您的旅行需求，AI为您生成完美的旅行计划</p>
        </header>

        <div class="card" id="planningView">
            <h2>📝 旅行需求</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="city">目的地城市</label>
                    <input type="text" id="city" placeholder="例如：北京" value="北京">
                </div>
                <div class="form-group">
                    <label for="start_date">开始日期</label>
                    <input type="date" id="start_date" value="2026-07-20">
                </div>
                <div class="form-group">
                    <label for="end_date">结束日期</label>
                    <input type="date" id="end_date" value="2026-07-22">
                </div>
                <div class="form-group">
                    <label for="travel_days">旅行天数</label>
                    <select id="travel_days">
                        <option value="1">1天</option>
                        <option value="2">2天</option>
                        <option value="3" selected>3天</option>
                        <option value="4">4天</option>
                        <option value="5">5天</option>
                        <option value="6">6天</option>
                        <option value="7">7天</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="transportation">交通方式</label>
                    <select id="transportation">
                        <option value="公共交通" selected>公共交通</option>
                        <option value="自驾">自驾</option>
                        <option value="步行">步行</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="accommodation">住宿偏好</label>
                    <select id="accommodation">
                        <option value="经济型酒店" selected>经济型酒店</option>
                        <option value="舒适型酒店">舒适型酒店</option>
                        <option value="豪华型酒店">豪华型酒店</option>
                        <option value="民宿">民宿</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="user_id">用户ID（用于旅行记忆）</label>
                    <input type="text" id="user_id" placeholder="默认：test_user" value="test_user">
                </div>
            </div>

            <div class="form-group">
                <label>旅行偏好</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="pref1" value="历史文化" checked>
                        <label for="pref1">历史文化</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="pref2" value="自然风光">
                        <label for="pref2">自然风光</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="pref3" value="美食">
                        <label for="pref3">美食</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="pref4" value="购物">
                        <label for="pref4">购物</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="pref5" value="亲子">
                        <label for="pref5">亲子</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="pref6" value="休闲">
                        <label for="pref6">休闲</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="free_text_input">额外要求（可选）</label>
                <textarea id="free_text_input" placeholder="例如：希望多安排一些博物馆，或者避开人多的景点..."></textarea>
            </div>

            <button class="btn" id="generateBtn" onclick="generateTripPlan()">
                🚀 生成旅行计划
            </button>
        </div>

        <div class="card result-section" id="resultSection">
            <h2>✨ 旅行计划</h2>
            
            <div class="memory-section" id="memorySection" style="display: none;">
                <h3>🧠 旅行记忆</h3>
                <div class="memory-info" id="memoryInfo"></div>
            </div>

            <div id="tripPlanContent"></div>

            <div class="action-bar" id="enterChatBar" style="display: none;">
                <button class="btn btn-secondary" onclick="enterChatPanel()">
                    💬 进入对话修改
                </button>
            </div>
        </div>

        <div class="card view-hidden" id="chatView">
            <div class="chat-layout">
                <div class="chat-panel">
                    <div class="chat-header">
                        <h3>💬 计划修改对话</h3>
                        <button class="back-link" onclick="backToPlanning()">← 返回重新规划</button>
                    </div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="输入修改指令，如：添加迪士尼、降低预算..."
                               onkeydown="if(event.key==='Enter') sendChatMessage()">
                        <button class="btn" id="sendChatBtn" onclick="sendChatMessage()">发送</button>
                    </div>
                </div>
                <div class="plan-preview">
                    <div class="plan-preview-header">📋 当前计划预览</div>
                    <div class="plan-preview-content" id="chatPlanPreview"></div>
                </div>
            </div>
        </div>

        <div class="api-docs">
            <p>API文档: <a href="/docs" target="_blank">Swagger UI</a> | <a href="/redoc" target="_blank">ReDoc</a></p>
        </div>
    </div>

    <script>
        let currentTripPlan = null;
        let currentTripMeta = null;
        let dialogThreadId = null;
        let dialogWelcome = '';

        function appendMessage(role, text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function showPlanningView() {
            document.getElementById('planningView').classList.remove('view-hidden');
            document.getElementById('resultSection').classList.remove('view-hidden');
            document.getElementById('chatView').classList.add('view-hidden');
        }

        function showChatView() {
            document.getElementById('planningView').classList.add('view-hidden');
            document.getElementById('resultSection').classList.add('view-hidden');
            document.getElementById('chatView').classList.remove('view-hidden');
        }

        function backToPlanning() {
            showPlanningView();
        }

        async function enterChatPanel() {
            if (!currentTripPlan || !dialogThreadId) {
                alert('请先生成旅行计划');
                return;
            }

            document.getElementById('chatMessages').innerHTML = '';
            appendMessage('system', dialogWelcome || '对话已就绪，请输入修改指令。');
            document.getElementById('chatPlanPreview').innerHTML = renderTripPlan(currentTripPlan);
            showChatView();
            document.getElementById('chatInput').focus();
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendChatBtn');
            const message = input.value.trim();

            if (!message || !dialogThreadId) return;

            input.value = '';
            appendMessage('user', message);

            sendBtn.disabled = true;
            input.disabled = true;

            try {
                const response = await fetch('/api/dialog/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        thread_id: dialogThreadId,
                        message: message,
                    })
                });

                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.message || '对话处理失败');
                }

                appendMessage('assistant', result.reply || '已处理您的请求。');

                // 始终用最新 trip_plan 刷新右侧预览
                if (result.trip_plan) {
                    currentTripPlan = result.trip_plan;
                    let previewHtml = '';
                    if (result.changes && result.changes.length > 0) {
                        const changesHtml = result.changes.map(c => `<li>${c}</li>`).join('');
                        previewHtml += `<div class="changes-badge"><strong>本次变更：</strong><ul>${changesHtml}</ul></div>`;
                    }
                    previewHtml += renderTripPlan(result.trip_plan);
                    document.getElementById('chatPlanPreview').innerHTML = previewHtml;
                    document.getElementById('tripPlanContent').innerHTML = renderTripPlan(result.trip_plan);
                } else if (result.changes && result.changes.length > 0) {
                    const changesHtml = result.changes.map(c => `<li>${c}</li>`).join('');
                    document.getElementById('chatPlanPreview').innerHTML =
                        `<div class="changes-badge"><strong>本次变更：</strong><ul>${changesHtml}</ul></div>` +
                        document.getElementById('chatPlanPreview').innerHTML;
                }

                if (['结束', '退出', '完成', '不需要修改'].includes(message)) {
                    appendMessage('system', '对话已结束，您可以返回重新规划或继续查看计划。');
                }
            } catch (error) {
                appendMessage('assistant', '处理失败：' + error.message);
            } finally {
                sendBtn.disabled = false;
                input.disabled = false;
                input.focus();
            }
        }

        async function generateTripPlan() {
            const btn = document.getElementById('generateBtn');
            const resultSection = document.getElementById('resultSection');
            const tripPlanContent = document.getElementById('tripPlanContent');
            const memorySection = document.getElementById('memorySection');
            const memoryInfo = document.getElementById('memoryInfo');
            const enterChatBar = document.getElementById('enterChatBar');

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>正在生成旅行计划...';
            
            resultSection.classList.remove('active');
            enterChatBar.style.display = 'none';
            dialogThreadId = null;
            dialogWelcome = '';
            showPlanningView();

            const preferences = [];
            document.querySelectorAll('.checkbox-item input:checked').forEach(cb => {
                preferences.push(cb.value);
            });

            const requestData = {
                city: document.getElementById('city').value,
                start_date: document.getElementById('start_date').value,
                end_date: document.getElementById('end_date').value,
                travel_days: parseInt(document.getElementById('travel_days').value),
                transportation: document.getElementById('transportation').value,
                accommodation: document.getElementById('accommodation').value,
                preferences: preferences,
                free_text_input: document.getElementById('free_text_input').value,
                user_id: document.getElementById('user_id').value
            };

            try {
                const response = await fetch('/api/trip/plan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                const result = await response.json();

                if (result.success && result.data) {
                    currentTripPlan = result.data;
                    dialogThreadId = result.thread_id || null;
                    dialogWelcome = result.welcome_message || '';
                    currentTripMeta = {
                        user_id: requestData.user_id,
                        transportation: requestData.transportation,
                        accommodation: requestData.accommodation,
                        travel_days: requestData.travel_days,
                    };

                    tripPlanContent.innerHTML = renderTripPlan(result.data);
                    resultSection.classList.add('active');
                    enterChatBar.style.display = 'flex';

                    const user_id = document.getElementById('user_id').value;
                    const city = document.getElementById('city').value;
                    
                    try {
                        const memoryResponse = await fetch(`/api/memory/${user_id}/${city}`);
                        const memoryResult = await memoryResponse.json();
                        
                        if (memoryResult.success && memoryResult.data) {
                            const data = memoryResult.data;
                            if (data.has_history) {
                                memoryInfo.innerHTML = `
                                    <p><strong>您之前去过${city} ${data.plan_count}次！</strong></p>
                                    <p>已访问景点：${data.visited_attractions.join('、')}</p>
                                    <p>本次计划将为您推荐不同的景点和路线</p>
                                `;
                                memorySection.style.display = 'block';
                            } else {
                                memorySection.style.display = 'none';
                            }
                        }
                    } catch (memoryError) {
                        console.log('获取旅行记忆失败:', memoryError);
                        memorySection.style.display = 'none';
                    }
                } else {
                    tripPlanContent.innerHTML = `<div class="error-message">${result.message || '生成失败'}</div>`;
                    resultSection.classList.add('active');
                }
            } catch (error) {
                console.error('Error:', error);
                tripPlanContent.innerHTML = `<div class="error-message">生成旅行计划时发生错误：${error.message}</div>`;
                resultSection.classList.add('active');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🚀 生成旅行计划';
            }
        }

        function renderTripPlan(data) {
            let html = '';

            if (data.overall_suggestions) {
                html += `
                    <div class="overall-suggestions">
                        <h4>💡 总体建议</h4>
                        <p>${data.overall_suggestions}</p>
                    </div>
                `;
            }

            if (data.days && data.days.length > 0) {
                data.days.forEach((day, index) => {
                    const weather = data.weather_info ? data.weather_info[index] : null;
                    
                    html += `
                        <div class="day-card">
                            <div class="day-header">
                                <div class="day-title">第${index + 1}天 - ${day.date}</div>
                                ${weather ? `
                                    <div class="day-weather">
                                        <span>🌤️</span>
                                        <span>${weather.day_weather} ${weather.day_temp}°C</span>
                                    </div>
                                ` : ''}
                            </div>
                            
                            <p><strong>行程描述：</strong>${day.description}</p>
                            
                            ${day.attractions && day.attractions.length > 0 ? `
                                <div class="attraction-list">
                                    <h4>📍 景点安排（共${day.attractions.length}个）</h4>
                                    ${day.attractions.map((attraction, i) => `
                                        <div class="attraction-item">
                                            <div class="number">${i + 1}</div>
                                            <div class="attraction-info">
                                                <h4>${attraction.name}</h4>
                                                <p>${attraction.address || ''}</p>
                                                ${attraction.rating ? `<p>⭐ 评分：${attraction.rating}</p>` : ''}
                                                ${attraction.visit_duration ? `<p>⏱️ 建议游览：${attraction.visit_duration}分钟</p>` : ''}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}

                            ${day.time_slots && day.time_slots.length > 0 ? `
                                <div class="attraction-list" style="margin-top:12px;">
                                    <h4>🗓️ 当日时间表</h4>
                                    ${day.time_slots.map(slot => `
                                        <div class="attraction-item" style="align-items:flex-start;">
                                            <div class="number" style="min-width:72px;font-size:0.75rem;">${slot.start_time}-${slot.end_time}</div>
                                            <div class="attraction-info">
                                                <h4>${slot.activity_type || ''} · ${slot.activity_name || ''}</h4>
                                                <p>${slot.description || ''}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}

                            ${day.route_segments && day.route_segments.length > 0 ? `
                                <div class="attraction-list" style="margin-top:12px;">
                                    <h4>🗺️ 路线规划（高德）</h4>
                                    ${day.route_segments.map((seg, i) => `
                                        <div class="attraction-item">
                                            <div class="number">${i + 1}</div>
                                            <div class="attraction-info">
                                                <h4>${seg.start_point} → ${seg.end_point}</h4>
                                                <p>${seg.transport_mode || '交通'} · 约${seg.duration || '?'}分钟${seg.distance ? ` · ${seg.distance >= 1000 ? (seg.distance/1000).toFixed(1)+'公里' : seg.distance+'米'}` : ''}</p>
                                                <p>${seg.description || ''}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            
                            ${day.meals && day.meals.length > 0 ? `
                                <div class="meal-list">
                                    ${day.meals.map(meal => `
                                        <div class="meal-item">
                                            <strong>${meal.type === 'breakfast' ? '早餐' : meal.type === 'lunch' ? '午餐' : meal.type === 'dinner' ? '晚餐' : '加餐'}</strong>
                                            <span>${meal.name}</span>
                                            ${meal.estimated_cost ? `<span>¥${meal.estimated_cost}</span>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            
                            ${day.hotel ? `
                                <div class="hotel-info">
                                    <div>
                                        <h4>${day.hotel.name}</h4>
                                        <p>${day.hotel.address}</p>
                                        ${day.hotel.rating ? `<p>⭐ 评分：${day.hotel.rating}</p>` : ''}
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
            }

            if (data.budget) {
                const budget = data.budget;
                html += `
                    <div class="overall-suggestions" style="background: #e8f5e9; border-left-color: #4caf50;">
                        <h4>💰 预算预估</h4>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                            <div>
                                <p>景点门票：¥${budget.total_attractions}</p>
                            </div>
                            <div>
                                <p>酒店住宿：¥${budget.total_hotels}</p>
                            </div>
                            <div>
                                <p>餐饮费用：¥${budget.total_meals}</p>
                            </div>
                            <div>
                                <p>交通费用：¥${budget.total_transportation}</p>
                            </div>
                            <div style="font-weight: bold; font-size: 1.2rem;">
                                <p>总计：¥${budget.total}</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            return html;
        }
    </script>
</body>
</html>
